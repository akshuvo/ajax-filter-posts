<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <style>
    @keyframes slide1 {
      0%, 10%   { transform: translate(0, 0); }
      22%, 85%  { transform: translate(84px, 0); }
      97%, 100% { transform: translate(84px, 84px); }
    }
    @keyframes slide2 {
      0%, 35%   { transform: translate(0, 0); }
      47%, 100% { transform: translate(0, -84px); }
    }
    @keyframes slide3 {
      0%, 60%   { transform: translate(0, 0); }
      72%, 100% { transform: translate(-84px, 0); }
    }
    @keyframes sparkCycle {
      0%, 8%    { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      14%       { transform: translate(0, 0) scale(0.2) rotate(45deg); opacity: 0; }
      15%       { transform: translate(-84px, 0) scale(0.2) rotate(45deg); opacity: 0; }
      24%, 33%  { transform: translate(-84px, 0) scale(1) rotate(90deg); opacity: 1; }
      39%       { transform: translate(-84px, 0) scale(0.2) rotate(135deg); opacity: 0; }
      40%       { transform: translate(-84px, 84px) scale(0.2) rotate(135deg); opacity: 0; }
      49%, 58%  { transform: translate(-84px, 84px) scale(1) rotate(180deg); opacity: 1; }
      64%       { transform: translate(-84px, 84px) scale(0.2) rotate(225deg); opacity: 0; }
      65%       { transform: translate(0, 84px) scale(0.2) rotate(225deg); opacity: 0; }
      74%, 83%  { transform: translate(0, 84px) scale(1) rotate(270deg); opacity: 1; }
      89%       { transform: translate(0, 84px) scale(0.2) rotate(315deg); opacity: 0; }
      90%       { transform: translate(0, 0) scale(0.2) rotate(315deg); opacity: 0; }
      98%, 100% { transform: translate(0, 0) scale(1) rotate(360deg); opacity: 1; }
    }
    .t1 { animation: slide1 5.2s cubic-bezier(0.34, 1.25, 0.64, 1) infinite; }
    .t2 { animation: slide2 5.2s cubic-bezier(0.34, 1.25, 0.64, 1) infinite; }
    .t3 { animation: slide3 5.2s cubic-bezier(0.34, 1.25, 0.64, 1) infinite; }
    .sp { transform-box: fill-box; transform-origin: center; animation: sparkCycle 5.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .t1, .t2, .t3, .sp { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="sheen" x1="128" y1="0" x2="128" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="140" y1="50" x2="205" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF08A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B1023" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#sheen)"/>
  <g filter="url(#sh)">
    <rect class="t1" x="51" y="51" width="70" height="70" rx="16" fill="#fff"/>
    <rect class="t2" x="51" y="135" width="70" height="70" rx="16" fill="#fff"/>
    <rect class="t3" x="135" y="135" width="70" height="70" rx="16" fill="#fff"/>
    <path class="sp" d="M170,46 C173.15,77 179,82.85 210,86 C179,89.15 173.15,95 170,126 C166.85,95 161,89.15 130,86 C161,82.85 166.85,77 170,46 Z" fill="url(#gold)"/>
  </g>
</svg>
